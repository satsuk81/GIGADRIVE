<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#12345A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E4D8C;stop-opacity:1" />
    </linearGradient>
    <clipPath id="clip">
      <rect width="1200" height="630" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Decorative diagonal slash (right side) -->
  <polygon points="820,0 1200,0 1200,630 980,630" fill="#1E4D8C" opacity="0.45" clip-path="url(#clip)" />
  <polygon points="910,0 1200,0 1200,630 1080,630" fill="#D4DE28" opacity="0.07" clip-path="url(#clip)" />

  <!-- Bottom accent bar -->
  <rect x="0" y="592" width="1200" height="38" fill="#FF2E9A" opacity="0.12" />

  <!-- Left accent stripe -->
  <rect x="0" y="0" width="8" height="630" fill="#FF2E9A" />
  <rect x="8" y="0" width="4" height="630" fill="#D4DE28" />

  <!-- ═══════════════════════════════════════════
       WORDMARK — dark outline + colour fill to match logo PNG
       ═══════════════════════════════════════════ -->

  <!-- "GIGA" — shadow/outline layer -->
  <text
    x="84"
    y="318"
    font-family="'Barlow Condensed', Impact, sans-serif"
    font-size="210"
    font-weight="900"
    fill="#0D1117"
    stroke="#0D1117"
    stroke-width="14"
    stroke-linejoin="round"
    letter-spacing="-4"
    paint-order="stroke fill"
  >GIGA</text>
  <!-- "GIGA" — colour fill -->
  <text
    x="80"
    y="314"
    font-family="'Barlow Condensed', Impact, sans-serif"
    font-size="210"
    font-weight="900"
    fill="#FF2E9A"
    stroke="#2A1020"
    stroke-width="5"
    stroke-linejoin="round"
    letter-spacing="-4"
    paint-order="stroke fill"
  >GIGA</text>

  <!-- "DRIVE" — shadow/outline layer -->
  <text
    x="474"
    y="318"
    font-family="'Barlow Condensed', Impact, sans-serif"
    font-size="210"
    font-weight="900"
    fill="#0D1117"
    stroke="#0D1117"
    stroke-width="14"
    stroke-linejoin="round"
    letter-spacing="-4"
    paint-order="stroke fill"
  >DRIVE</text>
  <!-- "DRIVE" — colour fill -->
  <text
    x="470"
    y="314"
    font-family="'Barlow Condensed', Impact, sans-serif"
    font-size="210"
    font-weight="900"
    fill="#D4DE28"
    stroke="#2A2E08"
    stroke-width="5"
    stroke-linejoin="round"
    letter-spacing="-4"
    paint-order="stroke fill"
  >DRIVE</text>

  <!-- Tagline — blue-grey spaced capitals, matches logo style -->
  <text
    x="83"
    y="384"
    font-family="'Barlow Condensed', 'Barlow', Impact, sans-serif"
    font-size="40"
    font-weight="700"
    fill="#7B9AB8"
    letter-spacing="10"
  >GET IN GEAR AND DRIVE</text>

  <!-- Divider line -->
  <rect x="80" y="412" width="520" height="3" fill="#FF2E9A" opacity="0.5" rx="2" />

  <!-- Sub-copy -->
  <text
    x="80"
    y="468"
    font-family="'Barlow', 'Segoe UI', sans-serif"
    font-size="30"
    font-weight="500"
    fill="#FFFFFF"
    opacity="0.65"
  >Professional Driving Lessons · Gravesend, Kent</text>

  <!-- DVSA badge pill -->
  <rect x="80" y="496" width="248" height="50" rx="25" fill="#FF2E9A" />
  <text
    x="204"
    y="527"
    font-family="'Barlow Condensed', Impact, sans-serif"
    font-size="22"
    font-weight="800"
    fill="#FFFFFF"
    text-anchor="middle"
    letter-spacing="2"
  >DVSA APPROVED</text>

  <!-- Website URL -->
  <text
    x="80"
    y="590"
    font-family="'Barlow', 'Segoe UI', sans-serif"
    font-size="26"
    font-weight="600"
    fill="#D4DE28"
    opacity="0.85"
  >www.gigadrive.co.uk</text>

</svg>
